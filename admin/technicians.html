<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technicians | Daisenko</title>

  <!-- ICON -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="/css/admin/technicians.css">
  <link rel="stylesheet" href="/css/admin/style.css">
</head>

<body data-page="technicians">

  <div class="layout">
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <!-- LOGO -->
      <div class="sidebar-logo">
        <img src="/images/logo.png" alt="Daisenko Logo">
      </div>
      <div class="sidebar-divider"></div>

      <a href="dashboard.html" data-link="dashboard">
        <i class="ri-dashboard-line"></i> แดชบอร์ด
      </a>

      <a href="request.html" data-link="request">
        <i class="ri-user-line"></i> รายการคำขอ
      </a>

      <a href="technicians.html" data-link="technicians" class="active">
        <i class="ri-group-line"></i> รายชื่อช่าง
      </a>

      <a href="service_edit.html" data-link="service_edit">
        <i class="ri-file-list-line"></i> แก้ไขบริการ
      </a>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- ===== TOP NAV ===== -->
      <nav class="top-nav">

        <!-- TOP ROW -->
        <div class="top-row">
          <div class="top-left-group">
            <button class="icon-btn" onclick="toggleSidebar()">
              <i class="ri-menu-line"></i>
            </button>

            <!-- <h1 class="page-title">Technicians</h1> -->
          </div>

          <div class="top-nav-right">
            <div class="search-wrapper">
              <input id="searchInput" type="text" placeholder="ค้นหา" oninput="searchTechnicians()" />
              <button class="icon-btn" onclick="openSearch()">
                <i class="ri-search-line"></i>
              </button>
            </div>

            <div class="notification-wrapper">
              <button class="icon-btn" onclick="toggleNotification()">
                <i class="ri-notification-3-line"></i>
                <span id="notifyCount" class="notify-badge">0</span>
              </button>
              <div id="notificationDropdown" class="notification-dropdown">
                <ul id="notificationList"></ul>
              </div>
            </div>

            <div class="user-wrapper">
              <button class="user-btn" onclick="toggleUserMenu()">
                <span class="user-avatar" id="profileAvatar"></span>

                <span class="user-name" id="profileName"></span>
                <i class="ri-arrow-down-s-line"></i>
              </button>

              <div id="userDropdown" class="user-dropdown">
                <button onclick="logout()">
                  <i class="ri-logout-box-r-line"></i>
                  Logout
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- DIVIDER -->
        <div class="top-divider"></div>
      </nav>

      <!-- CONTENT -->
      <div class="content">
        <section class="table-box">
          <h2>สถานะช่าง</h2>

          <table>
            <thead>
              <tr>
                <th>ชื่อช่าง</th>
                <th>สถานะ</th>
                <th>งานที่รับอยู่</th>
              </tr>
            </thead>
            <tbody id="techTable">
              <!-- JS render -->
            </tbody>
          </table>
        </section>
      </div>

    </main>
  </div>

  <!-- SEARCH OVERLAY -->
  <div id="searchOverlay" class="search-overlay">
    <div class="search-panel">
      <div class="search-header">
        <i class="ri-search-line"></i>
        <input type="text" id="searchMobileInput" placeholder="ค้นหา..." oninput="searchTechnicians()">
        <button onclick="closeSearchOverlay()">✕</button>
      </div>

      <div class="search-body">
        <p class="search-title">การค้นหายอดนิยม</p>
        <div id="searchResults"></div>
      </div>
    </div>
  </div>

  <script>
    /* ===== SIDEBAR TOGGLE ===== */
function toggleSidebar() {
  const sidebar = document.querySelector(".sidebar");
  const main = document.querySelector(".main");
  const overlay = document.querySelector(".sidebar-overlay");

  const isMobile = window.innerWidth <= 900;

  if (isMobile) {
    sidebar.classList.toggle("open");

    if (sidebar.classList.contains("open")) {
      const ov = document.createElement("div");
      ov.className = "sidebar-overlay";
      ov.onclick = toggleSidebar;
      document.body.appendChild(ov);
    } else {
      if (overlay) overlay.remove();
    }

  } else {
    sidebar.classList.toggle("closed");
    main.classList.toggle("full");
  }
}
/* ===== AUTH ===== */
function loadAdminProfile() {

  const admin = JSON.parse(localStorage.getItem("adminData"));

  if (!admin) {
    window.location.href = "login.html";
    return;
  }

  const nameElement = document.getElementById("profileName");
  const avatarElement = document.getElementById("profileAvatar");

  nameElement.textContent = admin.username;

  const firstLetter = admin.username.charAt(0).toUpperCase();
  avatarElement.textContent = firstLetter;
}

if (localStorage.getItem("adminLoggedIn") !== "true") {
  window.location.href = "login.html";
}

function logout() {
  localStorage.removeItem("adminLoggedIn");
  localStorage.removeItem("adminData");
  window.location.href = "login.html";
}

function toggleUserMenu() {
  const dropdown = document.getElementById("userDropdown");
  const overlay = document.querySelector(".user-overlay");

  if (overlay) {
    dropdown.style.display = "none";
    overlay.remove();
    return;
  }

  dropdown.style.display = "block";

  const ov = document.createElement("div");
  ov.className = "user-overlay";
  ov.style.position = "fixed";
  ov.style.inset = "0";
  ov.style.zIndex = "999";
  ov.onclick = toggleUserMenu;
  document.body.appendChild(ov);
}

/* ===== ACTIVE SIDEBAR ===== */
document.addEventListener("DOMContentLoaded", () => {
  const page = document.body.dataset.page;
  document.querySelectorAll(".sidebar a").forEach(link => {
    if (link.dataset.link === page) {
      link.classList.add("active");
    }
  });
  loadAdminProfile();
  loadNotifications();
  //updateDashboardStats();
});

window.addEventListener("load", scrollToBookingFromHash);
window.addEventListener("hashchange", scrollToBookingFromHash);


function scrollToBookingFromHash() {
  const hash = window.location.hash.replace("#", "");

  if (!hash) return;

  setTimeout(() => {
    const target = document.getElementById(`row-${hash}`);

    if (target) {
      target.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

      // highlight
      target.style.background = "#fff3cd";

      setTimeout(() => {
        target.style.background = "";
      }, 2000);
    }
  }, 300); // รอ render
}


/* ===== NOTIFICATION ===== */
const notifySound = new Audio("../sounds/notify.mp3");
notifySound.volume = 1;

let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;

  notifySound.play()
    .then(() => {
      notifySound.pause();
      notifySound.currentTime = 0;
      audioUnlocked = true;
      console.log("🔓 Audio unlocked");
    })
    .catch(err => console.log("unlock error", err));
}

document.addEventListener("click", unlockAudio, { once: true });


function loadNotifications() {
  const notifications = JSON.parse(localStorage.getItem("notifications")) || [];
  const unread = notifications.filter(n => !n.read);

  const badge = document.getElementById("notifyCount");
  const list = document.getElementById("notificationList");

  badge.textContent = unread.length;
  badge.style.display = unread.length ? "flex" : "none";
  list.innerHTML = "";

  notifications.forEach((n, i) => {
    const li = document.createElement("li");
    li.textContent = n.message;
    li.className = n.read ? "" : "unread";

    li.onclick = () => {

      notifications[i].read = true;
      localStorage.setItem("notifications", JSON.stringify(notifications));
      loadNotifications();

      document.getElementById("notificationDropdown").style.display = "none";
      const ov = document.querySelector(".notification-overlay");
      if (ov) ov.remove();

      if (n.type === "booking" && n.bookingId) {
        window.location.href = `request.html#${n.bookingId}`;
      }
    };


    list.appendChild(li);
  });
}

function toggleNotification() {
  const dropdown = document.getElementById("notificationDropdown");
  const overlay = document.querySelector(".notification-overlay");

  if (overlay) {
    dropdown.style.display = "none";
    overlay.remove();
    return;
  }

  dropdown.style.display = "block";
  const ov = document.createElement("div");
  ov.className = "notification-overlay";
  ov.onclick = toggleNotification;
  document.body.appendChild(ov);
}

loadNotifications();

/* ===== SEARCH TECHNICIANS ===== */
let currentKeyword = "";

function searchTechnicians() {
    const desktopInput = document.getElementById("searchInput");
    const mobileInput = document.getElementById("searchMobileInput");

    const keyword =
        (desktopInput?.value || mobileInput?.value || "").toLowerCase();

    currentKeyword = keyword;

    renderTechnicians();
}

/* ===== INIT SEARCH ===== */
document.addEventListener("DOMContentLoaded", () => {
    const desktopInput = document.getElementById("searchInput");
    const mobileInput = document.getElementById("searchMobileInput");

    // realtime search
    desktopInput?.addEventListener("input", searchTechnicians);
    mobileInput?.addEventListener("input", searchTechnicians);

    document.addEventListener("keydown", function (e) {

        // ===== ENTER =====
        if (e.key === "Enter") {
            if (
                document.activeElement === desktopInput ||
                document.activeElement === mobileInput
            ) {
                searchTechnicians();

                // ปิด mobile overlay
                if (window.innerWidth <= 768) {
                    closeSearchOverlay();
                }

                // ปิด desktop input
                desktopInput?.classList.remove("show");

                document.activeElement.blur();
            }
        }

        // ===== ESC =====
        if (e.key === "Escape") {
            if (desktopInput) {
                desktopInput.value = "";
                desktopInput.classList.remove("show");
            }

            if (mobileInput) {
                mobileInput.value = "";
            }

            currentKeyword = "";
            renderTechnicians();

            closeSearchOverlay();
        }

        // ===== CTRL + F =====
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
            e.preventDefault();

            if (window.innerWidth <= 768) {
                openSearch();
            } else {
                desktopInput?.classList.add("show");
                desktopInput?.focus();
                desktopInput?.select();
            }
        }
    });
});

function searchTechnicians() {
    const desktopInput = document.getElementById("searchInput");
    const mobileInput = document.getElementById("searchMobileInput");

    const keyword =
        (desktopInput?.value || mobileInput?.value || "").toLowerCase();

    currentKeyword = keyword;

    renderTechnicians();
}

document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
        const input = document.getElementById("searchInput");
        input.classList.remove("show");
        input.value = "";
        currentKeyword = "";
        renderTechnicians();
    }
});

function openSearch() {
    const isMobile = window.innerWidth <= 768;

    if (isMobile) {
        document.getElementById("searchOverlay").classList.add("show");
        document.getElementById("searchMobileInput").focus();
    } else {

        const input = document.getElementById("searchInput");
        input.classList.toggle("show");
        input.focus();
    }
}

function closeSearchOverlay() {
    document.getElementById("searchOverlay").classList.remove("show");
}

document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
        closeSearchOverlay();

        const input = document.getElementById("searchInput");
        input.classList.remove("show");
    }
});

  </script>
  <script type="module">
    import { db } from "../js/admin/firebase.js";
    import {
      collection,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const table = document.getElementById("techTable");

    // เก็บ bookings แบบ realtime
    let bookings = [];

    /* ========================
       BOOKINGS REALTIME
    ======================== */
    function listenBookings() {
      const q = query(
        collection(db, "bookings"),
        orderBy("createdAt", "desc")
      );

      onSnapshot(q, (snapshot) => {
        bookings = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));

        renderTechnicians();
      });
    }

    /* ========================
       TECHNICIANS REALTIME
    ======================== */
    function listenTechniciansRealtime() {

      const q = collection(db, "technicians");

      onSnapshot(q, (snapshot) => {

        const techs = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));

        renderTechnicians(techs);
      });
    }

    /* ========================
       RENDER
    ======================== */
    function renderTechnicians(techs = []) {

      table.innerHTML = "";

      techs.forEach(data => {

        const status = (data.status || "").trim();

        let statusText = "ออฟไลน์";
        let statusClass = "offline";

        if (status === "online") {
          statusText = "ว่าง";
          statusClass = "available";
        }

        if (status === "busy") {
          statusText = "ไม่ว่าง";
          statusClass = "busy";
        }

        // FIX: ใช้ bookings 
        const jobCount = bookings.filter(b =>
          (b.technicianId || "").trim() === (data.name || "").trim() &&
          b.status === "assigned"
        ).length;

        const tr = document.createElement("tr");

        tr.id = `row-${data.id}`;

        tr.innerHTML = `
      <td>${data.name || "-"}</td>

      <td>
        <span class="status ${statusClass}">
          ${statusText}
        </span>
      </td>

      <td>
        ${jobCount > 0 ? jobCount + " งาน" : "-"}
      </td>
    `;

        table.appendChild(tr);

        /* ===== MOBILE CARD ===== */
        mobileContainer.innerHTML += `
        <div class="tech-card">
            <div class="tech-row">
            <div class="tech-label">ชื่อช่าง</div>
            <div class="tech-value">${tech.name}</div>
            </div>

            <div class="tech-row">
            <div class="tech-label">สถานะ</div>
            <div class="tech-value">
                <span class="status ${statusClass}">
                ${statusText}
                </span>
            </div>
            </div>

            <div class="tech-row">
            <div class="tech-label">งานที่รับอยู่</div>
            <div class="tech-value">${jobText}</div>
            </div>
        </div>
        `;
      });
    }

    /* ========================
       START
    ======================== */
    listenBookings();
    listenTechniciansRealtime();

  </script>
    
</body>

</html>
